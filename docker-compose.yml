services:
  excalidraw:
    build:
      context: .
      target: development
    container_name: excalidraw
    init: true
    ports:
      - "3001:3001"
    restart: unless-stopped
    stdin_open: true
    tty: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/notes').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      QWEN_BASE_URL: ${QWEN_BASE_URL:-http://172.31.69.234:8006/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.8-27b}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
    volumes:
      - ./:/opt/node_app
      - node_modules:/opt/node_app/node_modules
      - app_node_modules:/opt/node_app/excalidraw-app/node_modules
    develop:
      watch:
        - action: rebuild
          path: package.json
        - action: rebuild
          path: yarn.lock

volumes:
  node_modules:
  app_node_modules:
