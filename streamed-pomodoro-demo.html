<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>番茄钟 · SSE 增量 UI 演示</title>
<style>
  :root{color-scheme:light;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f3ef;color:#302b29}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 15px}
  .layout{max-width:560px;margin:auto}
  h1{font-size:20px;margin:0 0 7px}
  .explain{font-size:13px;line-height:1.7;color:#72685f;margin:0 0 18px}
  .card{--accent:#d95442;background:#fffdf9;border:1px solid #eee3da;border-radius:24px;min-height:250px;padding:23px;box-shadow:0 12px 35px #503a2612}
  .header{display:flex;align-items:center;gap:12px;min-height:45px}
  .icon{font-size:29px;background:#faebe5;border-radius:14px;padding:5px;line-height:1.3}
  .title{font-size:19px;font-weight:750}
  .modes{display:flex;gap:6px;padding:5px;background:#f5f0eb;border-radius:13px;margin:18px 0 0}
  button{font:inherit;cursor:pointer}
  .mode{border:0;border-radius:9px;background:transparent;color:#857b73;flex:1;font-size:12px;padding:11px 4px}
  .mode.on{background:#fff;color:var(--accent);box-shadow:0 2px 8px #1e15120d;font-weight:700}
  .dial{position:relative;width:230px;height:230px;margin:21px auto 0}
  .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
  .track{fill:none;stroke:#f0e7df;stroke-width:9}
  .progress{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset .2s linear,stroke .2s}
  .time{position:absolute;inset:0;display:grid;place-content:center;font-size:57px;font-weight:800;letter-spacing:-2px;font-variant-numeric:tabular-nums}
  .controls{display:flex;justify-content:center;gap:12px;margin:14px 0 20px}
  .main{border:0;border-radius:12px;background:var(--accent);color:white;padding:13px 23px;min-width:144px;font-weight:700}
  .secondary{border:0;border-radius:12px;background:#f3ede7;padding:13px 16px}
  .task{border-top:1px solid #eee4da;padding-top:16px}
  .task label{font-size:12px;color:#8c7b6d;display:block;margin-bottom:8px}
  .task input{display:block;width:100%;font:inherit;background:white;color:#302b29;border:1px solid #ddd1c6;border-radius:10px;padding:12px;outline-offset:2px}
  .notice{font-size:12px;color:#8c7b6d;margin-top:14px}
  .logs{font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;max-height:200px;overflow:auto;background:#f0ebe5;border-radius:12px;padding:12px;margin-top:15px}
</style>
</head>
<body>
<main class="layout">
  <h1>🍅 Qwen / SSE 增量界面实验</h1>
  <p class="explain">页面不依赖 ChatGPT。下面的内容只响应模拟 SSE 事件：① 图标 → ② 模式与圆环 → ③ 时间、按钮和输入框 → ④ 修改已存在的标题与颜色。第三阶段出现后可立即输入任务和开始倒计时，第四阶段不会清空它们。</p>
  <div id="pomodoro" class="card" aria-live="polite"></div>
  <div id="events" class="logs" aria-label="收到的 SSE 事件">等待 SSE 数据...\n</div>
</main>
<script>
(() => {
  'use strict';
  const root = document.getElementById('pomodoro');
  const log = document.getElementById('events');
  const $ = (selector) => root.querySelector(selector);
  const ns = 'http://www.w3.org/2000/svg';
  const r = 94;
  const C = 2 * Math.PI * r;
  const names = {focus:'专注', short:'短休', long:'长休'};
  const state = {
    rev: 0,
    mode: 'focus',
    durations: {focus:25, short:5, long:15},
    remainingMs: 25*60*1000,
    deadline: null,
    running: false,
    completed: 0,
    task: '',
    taskUserRevision: 0
  };

  function element(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function svgElement(tag, className, attrs) {
    const e = document.createElementNS(ns, tag);
    if (className) e.setAttribute('class', className);
    for (const [key, val] of Object.entries(attrs || {})) e.setAttribute(key, String(val));
    return e;
  }
  function ensureHeader() {
    if ($('.header')) return;
    const header = element('div', 'header');
    const icon = element('span', 'icon', '🍅');
    const title = element('span', 'title', '');
    header.append(icon, title);
    root.append(header);
  }
  function ensureModesAndRing() {
    if ($('.dial')) return;
    const modes = element('div','modes');
    for (const key of ['focus','short','long']) {
      const btn = element('button','mode',names[key]);
      btn.type = 'button'; btn.dataset.action = 'mode'; btn.dataset.mode = key;
      modes.append(btn);
    }
    const dial = element('div','dial');
    const svg = svgElement('svg','', {viewBox:'0 0 220 220','aria-hidden':'true'});
    svg.append(
      svgElement('circle','track',{cx:110,cy:110,r}),
      svgElement('circle','progress',{cx:110,cy:110,r, 'stroke-dasharray':C})
    );
    dial.append(svg);
    root.append(modes,dial);
  }
  function ensureControlsAndTask() {
    if ($('.controls')) return;
    const time = element('div','time','25:00');
    $('.dial').append(time);
    const controls = element('div','controls');
    for (const [action,label,klass] of [
      ['reset','↺ 重置','secondary'],
      ['toggle','▶ 开始','main']
    ]) {
      const b=element('button',klass,label);
      b.type='button'; b.dataset.action=action; controls.append(b);
    }
    const area=element('div','task');
    const label=element('label','', '🎯 当前专注任务');
    label.htmlFor='task-input';
    const input=element('input');
    input.id='task-input'; input.placeholder='正在处理什么？';
    input.value=state.task;
    const status=element('div','notice','已完成 0 个番茄');
    area.append(label,input,status);
    root.append(controls,area);
  }
  function currentMs() {
    return state.running ? Math.max(0, state.deadline - Date.now()) : state.remainingMs;
  }
  function paint() {
    const total=state.durations[state.mode]*60*1000;
    const ms=currentMs();
    const progress=$('.progress');
    if(progress) progress.setAttribute('stroke-dashoffset',String(C*(1-ms/total)));
    const time=$('.time');
    if(time) {
      const seconds=Math.ceil(ms/1000);
      time.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
    }
    const toggle=$('[data-action="toggle"]');
    if(toggle) toggle.textContent=state.running?'Ⅱ 暂停':'▶ 开始';
    const notice=$('.notice');
    if(notice)notice.textContent='已完成 '+state.completed+' 个番茄';
    root.querySelectorAll('[data-action="mode"]').forEach(btn=>{
      btn.classList.toggle('on',btn.dataset.mode===state.mode);
    });
  }
  function switchMode(next) {
    if (!(next in state.durations)) return;
    state.running=false;
    state.deadline=null;
    state.mode=next;
    state.remainingMs=state.durations[next]*60*1000;
    paint();
  }
  function toggleClock() {
    if (state.running) {
      state.remainingMs=currentMs();
      state.running=false;
      state.deadline=null;
    } else {
      state.deadline=Date.now()+state.remainingMs;
      state.running=true;
    }
    paint();
  }
  // 只有一处事件委托，不因增量 UI 更新重复绑定。
  root.addEventListener('click', event => {
    const button=event.target.closest('button[data-action]');
    if(!button||!root.contains(button))return;
    const action=button.dataset.action;
    if(action==='mode') switchMode(button.dataset.mode);
    else if(action==='toggle') toggleClock();
    else if(action==='reset') switchMode(state.mode);
  });
  root.addEventListener('input', event=>{
    if(event.target.id==='task-input') {
      state.task=event.target.value;
      state.taskUserRevision++;
    }
  });
  // 全局只有一个 ticker。使用 deadline 防止后台标签页定时器漂移。
  setInterval(()=>{
    if(state.running && currentMs()===0){
      state.running=false;
      state.deadline=null;
      state.completed+=state.mode==='focus'?1:0;
      state.mode=state.mode==='focus'?(state.completed%4===0?'long':'short'):'focus';
      state.remainingMs=state.durations[state.mode]*60*1000;
    }
    paint();
  },200);

  // 这是本示例自定义的“UI 指令”，不是 ChatGPT 原生协议。
  function applyPatch(p) {
    if(!Number.isSafeInteger(p.rev)||p.rev<=state.rev)return;
    if(p.op==='add') {
      if(p.part==='icon')ensureHeader();
      else if(p.part==='modes-ring')ensureModesAndRing();
      else if(p.part==='clock-controls-task' && $('.dial'))ensureControlsAndTask();
      else return;
    } else if(p.op==='set') {
      if(p.field==='title') {
        if(typeof p.value!=='string'||p.value.length>80||!$('.title'))return;
        $('.title').textContent=p.value;
      } else if(p.field==='accent') {
        if(typeof p.value!=='string'||!/^#[0-9a-f]{6}$/i.test(p.value))return;
        root.style.setProperty('--accent',p.value);
      } else if(p.field==='task') {
        const input=$('#task-input');
        // 模型想改用户任务时，必须声明它所基于的用户修订号。
        // 有更新、输入框获得焦点、或没有基线，都明确拒绝，不静默覆盖。
        if(!input||!Number.isSafeInteger(p.baseUserRevision)||
           p.baseUserRevision!==state.taskUserRevision||document.activeElement===input) {
          log.textContent+='[冲突] 拒绝覆盖用户输入的任务名称\n';
          return;
        }
        if(typeof p.value!=='string'||p.value.length>100)return;
        state.task=p.value;
        input.value=p.value;
      } else return;
    } else return;
    state.rev=p.rev;
    paint();
    log.textContent+='[rev '+p.rev+'] '+p.op+' '+(p.part||p.field)+'\n';
  }

  function parseSSE(frame) {
    let event='message';
    const data=[];
    for(const line of frame.split('\n')) {
      if(line.startsWith('event:'))event=line.slice(6).trimStart();
      if(line.startsWith('data:'))data.push(line.slice(5).trimStart());
    }
    if(event==='ui' && data.length) {
      try {applyPatch(JSON.parse(data.join('\n')))}
      catch(error) {log.textContent+='JSON 解析失败: '+error.message+'\n';}
    }
  }
  async function consumeSSE(stream) {
    const reader=stream.getReader();
    const decoder=new TextDecoder();
    let buffer='';
    for(;;) {
      const {value,done}=await reader.read();
      if(done)break;
      buffer+=decoder.decode(value,{stream:true}).replace(/\r\n/g,'\n');
      let boundary;
      while((boundary=buffer.indexOf('\n\n'))!==-1) {
        parseSSE(buffer.slice(0,boundary));
        buffer=buffer.slice(boundary+2);
      }
    }
    buffer+=decoder.decode();
    if(buffer.trim())parseSSE(buffer);
    log.textContent+='[stream] 已结束；番茄钟仍可操作。\n';
  }

  // 用真正的 ReadableStream 产生 SSE 帧；用户界面的变更只由接收到的帧驱动。
  // 实际部署时，用 fetch('/api/...').then(r => consumeSSE(r.body)) 替换这一函数。
  function mockSSE() {
    const frames=[
      {delay:400, data:{rev:1,op:'add',part:'icon'}},
      {delay:1250,data:{rev:2,op:'add',part:'modes-ring'}},
      {delay:1450,data:{rev:3,op:'add',part:'clock-controls-task'}},
      {delay:7000,data:{rev:4,op:'set',field:'title',value:'小番茄 · Focus'}},
      {delay:500, data:{rev:5,op:'set',field:'accent',value:'#3b9a74'}}
    ];
    const encoder=new TextEncoder();
    const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
    return new ReadableStream({
      async start(controller) {
        try {
          for(const f of frames) {
            await sleep(f.delay);
            const bytes=encoder.encode('id: '+f.data.rev+'\nevent: ui\ndata: '+JSON.stringify(f.data)+'\n\n');
            const mid=Math.floor(bytes.length/2);
            controller.enqueue(bytes.slice(0,mid));
            await sleep(20);
            controller.enqueue(bytes.slice(mid));
          }
          controller.close();
        }catch(error){controller.error(error);}
      }
    });
  }
  log.textContent='模拟 SSE 已连接...\n';
  consumeSSE(mockSSE()).catch(error=>log.textContent+='连接错误: '+error.message+'\n');
})();
</script>
</body>
</html>
